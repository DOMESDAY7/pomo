[package]
name = "pomo"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Storage", "Request", "RequestInit", "Response", "FormData",
  "AudioContext", "BaseAudioContext", "OscillatorNode", "GainNode", "AudioParam",
  "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode",
  "Notification", "NotificationOptions", "NotificationPermission",
  "Navigator", "ServiceWorkerContainer", "ServiceWorkerRegistration", "ServiceWorker", "RequestMode",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
