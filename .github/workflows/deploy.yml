name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -sL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
      - name: Build
        run: trunk build --release --public-url /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing, Yandex, Seznam… (and through Bing, ChatGPT search) that the
      # pages changed. The key file is published at the site root.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 391ecc86b056b1f1ad33305b5d4c4eba
          HOST: pomo.domesday.fr
        run: |
          urls='["https://pomo.domesday.fr/","https://pomo.domesday.fr/en/","https://pomo.domesday.fr/es/","https://pomo.domesday.fr/de/","https://pomo.domesday.fr/pt/","https://pomo.domesday.fr/alternative-pomofocus/","https://pomo.domesday.fr/en/pomofocus-alternative/","https://pomo.domesday.fr/llms.txt"]'
          curl -sS --fail-with-body --retry 3 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://$HOST/$INDEXNOW_KEY.txt\",\"urlList\":$urls}"
